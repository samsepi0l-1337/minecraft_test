# =============================================================================
# 이 파일은 Gradle 빌드에 쓰이는 버전·JVM·병렬 실행 등의 상수를 한곳에 모읍니다.
# build.gradle에서 ${...} 형태로 참조됩니다.
# =============================================================================

# Gradle 데몬이 사용할 최대 힙. 의존성 해석·리매핑이 무거워 1G 이상을 권장합니다.
org.gradle.jvmargs=-Xmx1G
# 멀티프로젝트가 아니어도, 가능한 작업을 병렬로 돌려 빌드 시간을 줄입니다.
org.gradle.parallel=true

# configuration-cache: 일부 IDE/플러그인 조합에서 아직 호환 이슈가 있어 Loom 예제와 같이 끕니다.
# 값이 false이면 Gradle 구성 캐시를 사용하지 않습니다.
org.gradle.configuration-cache=false

# --- Fabric / Minecraft 버전 (https://fabricmc.net/develop 에서 조합 확인) ---

# 바닐라 클라이언트·서버 JAR를 받아올 때 사용하는 게임 버전입니다.
minecraft_version=1.21.1
# Fabric Loader 버전 — 바이트코드 후킹·모드 로딩의 핵심 런타임입니다.
loader_version=0.19.2
# Fabric Loom Gradle 플러그인 버전 — 소스 리매핑·runClient 등을 담당합니다.
loom_version=1.16-SNAPSHOT

# --- 이 모드 아티팩트 메타 ---

# 최종 JAR 파일명에 붙는 모드 버전입니다. fabric.mod.json의 ${version} 치환에도 쓰입니다.
mod_version=1.0.0
# Maven 좌표의 groupId에 해당합니다 (패키지 구조와 다를 수 있음).
maven_group=com.example

# --- 런타임에 넣는 라이브러리 모드 의존성 버전 ---

# Fabric API — 이벤트·네트워킹 등 공통 기능(이 모드는 최소 의존으로 포함).
fabric_api_version=0.116.12+1.21.1
