// Gradle이 플러그인(여기서는 Fabric Loom)을 어디서 받을지 정하는 전역 설정입니다.
pluginManagement {
	repositories {
		// Fabric 공식 Maven — Loom 플러그인 아티팩트가 호스팅됩니다.
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		// 일반 라이브러리 의존성 해소용.
		mavenCentral()
		// Gradle 자체 플러그인 포털.
		gradlePluginPortal()
	}
}

// IntelliJ/IDE에서 보이는 프로젝트 이름이자, 기본 JAR 베이스 이름에 영향을 줍니다.
// build.gradle의 loom.mods { helloworld { ... } } 블록과 맞출 필요는 없으나 관례적으로 동일하게 둡니다.
rootProject.name = 'helloworld'
